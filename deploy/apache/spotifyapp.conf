<VirtualHost *:80>
    ServerName yourdomain.example
    ServerAlias www.yourdomain.example

    # Static files collected by `python manage.py collectstatic`
    Alias /static/ /srv/spotifyapp/SpotifyApp/staticfiles/
    <Directory /srv/spotifyapp/SpotifyApp/staticfiles>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /srv/spotifyapp/SpotifyApp/SpotifyDjangoConfig>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Apache mod_wsgi deployment for the Django app.
    # Set the runtime variables in Apache's environment (for example via
    # /etc/apache2/envvars or a root-owned systemd drop-in), then pass them here.
    PassEnv SECRET_KEY
    PassEnv DEBUG
    PassEnv ALLOWED_HOSTS
    PassEnv CSRF_TRUSTED_ORIGINS
    PassEnv SESSION_COOKIE_SECURE
    PassEnv CSRF_COOKIE_SECURE
    PassEnv ADMIN_NAME
    PassEnv ADMIN_EMAIL
    PassEnv SERVER_EMAIL
    PassEnv CLIENTID
    PassEnv CLIENTSECRET
    PassEnv SPOTIFY_REDIRECT_URI
    PassEnv SPOTIFY_USERNAME
    PassEnv TOKEN_CACHE_DIR
    PassEnv SPOTIFY_OAUTH_OPEN_BROWSER

    WSGIDaemonProcess spotifyapp python-home=/srv/spotifyapp/venv python-path=/srv/spotifyapp/SpotifyApp \
        processes=2 threads=15 display-name=%{GROUP}
    WSGIProcessGroup spotifyapp
    WSGIScriptAlias / /srv/spotifyapp/SpotifyApp/SpotifyDjangoConfig/wsgi.py
    WSGIApplicationGroup %{GLOBAL}

    ErrorLog ${APACHE_LOG_DIR}/spotifyapp_error.log
    CustomLog ${APACHE_LOG_DIR}/spotifyapp_access.log combined
</VirtualHost>


