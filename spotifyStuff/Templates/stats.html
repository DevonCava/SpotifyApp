<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #121212 0%, #1f1f1f 100%);
            color: #ffffff;
            padding: 48px 24px;
            box-sizing: border-box;
        }

        .hero {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            overflow-wrap: break-word;
        }

        .user-title {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        .subtitle {
            margin: 8px 0 28px;
            color: #d1d1d1;
            line-height: 1.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }


        .stat-card h2 {
            margin: 0 0 10px;
            font-size: 1.15rem;
        }

        .stat-card p {
            margin: 0 0 10px;
            color: #d1d1d1;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .spotifyData {
            font-size: 0.95rem;
            color: #1ed760;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .view-button {
            border: 0;
            border-radius: 999px;
            background: #1db954;
            color: #ffffff;
            font-weight: 700;
            padding: 10px 18px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .view-button:hover {
            background: #1ed760;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <main class="hero">
        <h1 class="user-title">{{ user_name }}'s<br>Stats</h1>
        <p class="subtitle">
            These are placeholders for your Spotify statistics. Click <strong>View</strong> on any card
            to eventually open a more detailed breakdown for that category.
        </p>

        <section class="stats-grid" aria-label="User statistics">
            {% for card in stat_cards %}
                <article class="stat-card">
                    <h2>{{ card.title }}</h2>
                    <p>{{ card.description }}</p>
                    <div class="spotifyData">{{ card.spotifyData }}</div>
                    <button class="view-button" type="button">View</button>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
