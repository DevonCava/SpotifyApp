<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spotify Stats</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Arial, Helvetica, sans-serif;
		}

		body {
			position: relative;
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			background:
				radial-gradient(circle at top left, rgba(29, 185, 84, 0.22), transparent 32%),
				radial-gradient(circle at top right, rgba(37, 99, 235, 0.18), transparent 28%),
				radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.16), transparent 30%),
				linear-gradient(135deg, #09090c 0%, #13131a 42%, #191622 72%, #0f1720 100%);
			color: #ffffff;
		}

		body::before,
		body::after {
			content: '';
			position: fixed;
			inset: auto;
			border-radius: 999px;
			filter: blur(28px);
			pointer-events: none;
			opacity: 0.8;
		}

		body::before {
			top: 10%;
			right: -8%;
			width: 24rem;
			height: 24rem;
			background: radial-gradient(circle, rgba(29, 185, 84, 0.22) 0%, rgba(29, 185, 84, 0) 70%);
		}

		body::after {
			left: -10%;
			bottom: -8%;
			width: 28rem;
			height: 28rem;
			background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(59, 130, 246, 0) 72%);
		}

		.hero {
			position: relative;
			z-index: 1;
			max-width: 720px;
			padding: 48px 32px;
			text-align: center;
			border-radius: 24px;
			background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
			backdrop-filter: blur(12px);
		}

		h1 {
			margin: 0 0 16px;
			font-size: clamp(2.2rem, 5vw, 4rem);
		}

		p {
			margin: 0 auto 32px;
			max-width: 56ch;
			line-height: 1.6;
			color: #d1d1d1;
			font-size: 1.05rem;
		}

		.cta {
			display: inline-block;
			padding: 16px 28px;
			border-radius: 999px;
			background: #1db954;
			color: #ffffff;
			text-decoration: none;
			font-weight: 700;
			font-size: 1rem;
			transition: transform 0.2s ease, background 0.2s ease;
		}

		.cta:hover {
			background: #1ed760;
			transform: translateY(-2px);
		}

	</style>
</head>
<body>
	<main class="hero">
		<h1>Spotify Listening Stats</h1>
        <hr>
		<p>
			Connect your Spotify account to see a personalized dashboard with your top artists,
			listening time, and other streaming insights. This homepage is the starting point for
			authorizing access to your data.
		</p>
        <form action="/" method="post">
            {% csrf_token %}
            <button class="cta" type="submit" aria-label="Sign in with Spotify">
			Sign in with Spotify
		</button>
        </form>
        <p> {{message}}</p>
	</main>
</body>
</html>
